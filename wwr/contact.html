<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us: The Brave Boat</title>
    <meta name="description"
      content="This page focuses on providing information on how to contact The Brave Boat through various channels..">
    <meta name="author" content="Aaron Stick Martinez Zambrano">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="logo whitewater rafting" width="200">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="information">
            <h1>The Brave Boat | White Water Rafting</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>infobraveboat@whitewater.com</p>
        </div>
        <div class="information-form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d34041.097903449176!2d-111.61507536074585!3d41.05070671310798!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1swhite%20water%20rafting!5e0!3m2!1ses-419!2sec!4v1791084754024!5m2!1ses-419!2sec"
              allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>

                <div class="information-item column2 box">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name">
                </div>

                <div class="information-item column2 box">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="information-item column3 box">
                    <div>Message Purpose</div>
                    <div class="radio">
                        <label><input type="radio" name="message" id="general">General
                            Inquiry</label>

                        <label><input type="radio" name="message" id="reservation">Reservation
                            Question</label>

                        <label><input type="radio" name="message" id="suggestion">Website
                            Suggestion</label>

                    </div>
                </div>
                <div class="information-item column5 box">
                    <label for="message-user">Message</label>
                    <textarea name="message-user" id="message-user"></textarea>
                </div>

                <div class="information-item column4 box">
                    <input type="checkbox" name="subscription" id="subscription">
                    <label for="subscription">Please Subscribe me to the monthyly
                        newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>
        </div>

        <section class="grid-employee">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee.jpg" alt="employee trip leader">
                <figcaption>Trip Leader</figcaption>
            </figure>
            <figure>
                <img src="images/employee.jpg" alt="employee raft guide">
                <figcaption>Raft Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee.jpg" alt="employee safety kayaker">
                <figcaption>Safety Kayaker</figcaption>
            </figure>

        </section>

    </main>
    <footer>
        <p>&copy;2026 The Brave Boat | Aaron Martinez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
